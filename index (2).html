<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Из прошлого / From the Past — Digital Flipbook</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  :root{
    --bg: #0d0d0d;
    --panel: #161616;
    --accent: #8a7bff;
    --text: #eee;
    --muted: #999;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow:hidden;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    transition: background .3s;
  }
  #stage{
    position:relative;
    width:min(90vw, 82vh);
    height:min(90vw, 82vh);
    perspective: 2400px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: width .35s ease, height .35s ease;
    overflow:hidden;
  }
  #app.is-fullscreen{
    background:#000;
  }
  #app.is-fullscreen #stage{
    width:100vw;
    height:100vh;
  }
  #app.is-fullscreen .book-shadow{ display:none; }
  #app.is-fullscreen #progressTrack{ opacity:0.5; }
  #zoomWrapper{
    width:100%;
    height:100%;
    transform-origin: center center;
    transition: transform .28s cubic-bezier(.2,.8,.2,1);
    touch-action: none;
  }
  #zoomWrapper.dragging{
    transition: none;
    cursor: grabbing;
  }
  #zoomWrapper.zoomed{
    cursor: grab;
  }
  .book-shadow{
    position:absolute;
    bottom:-18px;
    left:5%;
    width:90%;
    height:24px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0) 75%);
    filter: blur(2px);
  }
  #pageContainer{
    position:relative;
    width:100%;
    height:100%;
    transform-style: preserve-3d;
  }
  .page{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    background:#111;
    border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    overflow:hidden;
    opacity:0;
    visibility:hidden;
    z-index:1;
  }
  .page img{
    width:100%; height:100%;
    object-fit:contain;
    display:block;
    background:#111;
    pointer-events:none;
    user-select:none;
  }
  .page.active{
    opacity:1;
    visibility:visible;
    z-index:2;
  }
  .page-face{
    position:absolute; top:0; left:0; width:100%; height:100%;
    backface-visibility:hidden;
  }
  .page-face.back{
    transform: rotateY(180deg);
  }
  .edge-tap{
    position:absolute;
    top:0; height:100%;
    width:15%;
    cursor:pointer;
    z-index:20;
  }
  .edge-tap.left{ left:0; }
  .edge-tap.right{ right:0; }

  #controls{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:22px;
    z-index:30;
  }
  .navbtn{
    background: var(--panel);
    border: 1px solid #2a2a2a;
    color: var(--text);
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:18px;
    transition: background .2s, transform .1s;
    user-select:none;
  }
  .navbtn:hover{ background:#232323; }
  .navbtn:active{ transform: scale(0.92); }
  .navbtn:disabled{ opacity:0.3; cursor:default; }

  #pageIndicator{
    min-width:110px;
    text-align:center;
    color: var(--muted);
    font-size:14px;
    letter-spacing:0.5px;
    font-variant-numeric: tabular-nums;
  }

  #topbar{
    position:absolute;
    top:0; left:0; right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 22px;
    z-index:30;
    pointer-events:none;
  }
  #title{
    font-size:14px;
    color: var(--muted);
    letter-spacing:0.5px;
    pointer-events:auto;
  }
  #hint{
    font-size:12px;
    color: var(--muted);
    opacity:0.7;
    pointer-events:auto;
  }
  #fullscreenBtn{
    pointer-events:auto;
    background: var(--panel);
    border: 1px solid #2a2a2a;
    color: var(--text);
    width:36px; height:36px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:15px;
    margin-left:12px;
    transition: background .2s, transform .1s;
  }
  #fullscreenBtn:hover{ background:#232323; }
  #fullscreenBtn:active{ transform: scale(0.92); }
  #topbarRight{
    display:flex;
    align-items:center;
    pointer-events:auto;
  }

  #progressTrack{
    position:absolute;
    bottom:0; left:0; right:0;
    height:3px;
    background:#1e1e1e;
    z-index:30;
  }
  #progressBar{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width .4s ease;
  }

  #topbar, #controls, #progressTrack{
    transition: opacity .4s ease;
  }
  #app.is-fullscreen.ui-hidden #topbar,
  #app.is-fullscreen.ui-hidden #controls,
  #app.is-fullscreen.ui-hidden #progressTrack{
    opacity:0;
    pointer-events:none;
  }
  #zoomControls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:14px;
    padding-left:14px;
    border-left:1px solid #2a2a2a;
  }
  #zoomLevel{
    font-size:12px;
    color: var(--muted);
    min-width:38px;
    text-align:center;
    font-variant-numeric: tabular-nums;
  }

  #thumbStrip{
    position:absolute;
    bottom:60px;
    left:0; right:0;
    display:flex;
    justify-content:center;
    gap:6px;
    z-index:25;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
  }
  #thumbStrip.show{
    opacity:1;
    pointer-events:auto;
  }
  #thumbStrip img{
    height:52px;
    border-radius:3px;
    cursor:pointer;
    opacity:0.55;
    transition:opacity .15s, transform .15s;
    border:1px solid #2a2a2a;
  }
  #thumbStrip img:hover{ opacity:1; transform:translateY(-4px); }
  #thumbStrip img.current{ opacity:1; outline:2px solid var(--accent); }

  #loadOverlay{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
    z-index:100;
    gap:14px;
  }
  #loadOverlay .spinner{
    width:36px;height:36px;
    border:3px solid #333;
    border-top-color: var(--accent);
    border-radius:50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg);} }

  @media (max-width: 640px){
    #stage{ width:94vw; height:94vw; }
    #thumbStrip{ display:none; }
    #hint{ display:none; }
  }
</style>
</head>
<body>

<div id="loadOverlay">
  <div class="spinner"></div>
  <div style="color:#999;font-size:13px;">Loading book…</div>
</div>

<div id="app">
  <div id="topbar">
    <div id="title">ИЗ ПРОШЛОГО — From the Past</div>
    <div id="topbarRight">
      <div id="hint">← → flip · scroll to zoom · F fullscreen</div>
      <div id="fullscreenBtn" title="Toggle fullscreen (F)">⛶</div>
    </div>
  </div>

  <div id="stage">
    <div class="book-shadow"></div>
    <div id="zoomWrapper">
      <div id="pageContainer"></div>
    </div>
    <div class="edge-tap left" id="leftTap"></div>
    <div class="edge-tap right" id="rightTap"></div>
  </div>

  <div id="controls">
    <div class="navbtn" id="firstBtn" title="First page">⏮</div>
    <div class="navbtn" id="prevBtn" title="Previous page">‹</div>
    <div id="pageIndicator">1 / 105</div>
    <div class="navbtn" id="nextBtn" title="Next page">›</div>
    <div class="navbtn" id="lastBtn" title="Last page">⏭</div>
    <div id="zoomControls">
      <div class="navbtn" id="zoomOutBtn" title="Zoom out">−</div>
      <div id="zoomLevel">100%</div>
      <div class="navbtn" id="zoomInBtn" title="Zoom in">+</div>
    </div>
  </div>

  <div id="thumbStrip"></div>
  <div id="progressTrack"><div id="progressBar"></div></div>
</div>

<script>
// PAGES_DATA_PLACEHOLDER
const total = 105;
const PAGES = Array.from({length: total}, (_, i) =>
  'page-' + String(i+1).padStart(3, '0') + '.jpg'
);
let current = 0; // 0-indexed, front-facing page index

const pageContainer = document.getElementById('pageContainer');
const pageIndicator = document.getElementById('pageIndicator');
const progressBar = document.getElementById('progressBar');
const thumbStrip = document.getElementById('thumbStrip');
const loadOverlay = document.getElementById('loadOverlay');

// Build DOM: stack of page divs, each positioned at its index (z-index = total-index)
// Simple single-page-at-a-time flip: each page is a div containing an img, stacked.
// We flip the current top page (rotateY -180) to reveal next one beneath.

function buildPages(){
  PAGES.forEach((src, i) => {
    const div = document.createElement('div');
    div.className = 'page';
    div.dataset.index = i;
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = src;
    img.alt = 'Page ' + (i+1);
    div.appendChild(img);
    pageContainer.appendChild(div);
  });
}

function buildThumbs(){
  PAGES.forEach((src, i) => {
    const t = document.createElement('img');
    t.src = src;
    t.dataset.index = i;
    t.className = (i === current) ? 'current' : '';
    t.addEventListener('click', () => goTo(i));
    thumbStrip.appendChild(t);
  });
}

function updateUI(){
  pageIndicator.textContent = (current+1) + ' / ' + total;
  progressBar.style.width = (((current+1)/total)*100) + '%';
  document.getElementById('firstBtn').disabled = current === 0;
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total-1;
  document.getElementById('lastBtn').disabled = current === total-1;
  const thumbs = thumbStrip.querySelectorAll('img');
  thumbs.forEach((t,i) => t.classList.toggle('current', i===current));
  const cur = thumbStrip.querySelector('img.current');
  if(cur) cur.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}

function applyFlips(){
  const pages = pageContainer.querySelectorAll('.page');
  pages.forEach((p) => {
    const idx = parseInt(p.dataset.index, 10);
    p.classList.toggle('active', idx === current);
  });
}

function goTo(i){
  if(i < 0 || i > total-1) return;
  current = i;
  applyFlips();
  updateUI();
  if(typeof setZoom === 'function') setZoom(1);
}

function next(){ if(current < total-1) goTo(current+1); }
function prev(){ if(current > 0) goTo(current-1); }

document.getElementById('nextBtn').addEventListener('click', next);
document.getElementById('prevBtn').addEventListener('click', prev);
document.getElementById('firstBtn').addEventListener('click', () => goTo(0));
document.getElementById('lastBtn').addEventListener('click', () => goTo(total-1));
document.getElementById('leftTap').addEventListener('click', () => { if(zoom.scale === 1) prev(); });
document.getElementById('rightTap').addEventListener('click', () => { if(zoom.scale === 1) next(); });

// ---------- Zoom / Pan ----------
const zoomWrapper = document.getElementById('zoomWrapper');
const zoomLevelLabel = document.getElementById('zoomLevel');
const stageEl = document.getElementById('stage');
const MIN_ZOOM = 1, MAX_ZOOM = 4;
const zoom = { scale: 1, x: 0, y: 0 };

function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

function clampPan(){
  // limit panning so image doesn't drift entirely off-stage
  const maxOffset = (zoom.scale - 1) * (stageEl.clientWidth / 2) + 40;
  zoom.x = clamp(zoom.x, -maxOffset, maxOffset);
  const maxOffsetY = (zoom.scale - 1) * (stageEl.clientHeight / 2) + 40;
  zoom.y = clamp(zoom.y, -maxOffsetY, maxOffsetY);
}

function applyZoom(){
  clampPan();
  zoomWrapper.style.transform = `translate(${zoom.x}px, ${zoom.y}px) scale(${zoom.scale})`;
  zoomWrapper.classList.toggle('zoomed', zoom.scale > 1);
  zoomLevelLabel.textContent = Math.round(zoom.scale * 100) + '%';
  document.getElementById('leftTap').style.pointerEvents = zoom.scale > 1 ? 'none' : 'auto';
  document.getElementById('rightTap').style.pointerEvents = zoom.scale > 1 ? 'none' : 'auto';
}

function setZoom(newScale){
  const clamped = clamp(newScale, MIN_ZOOM, MAX_ZOOM);
  zoom.scale = clamped;
  if(clamped === 1){ zoom.x = 0; zoom.y = 0; }
  applyZoom();
}

document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(zoom.scale + 0.5));
document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(zoom.scale - 0.5));

stageEl.addEventListener('wheel', (e) => {
  // Only treat as zoom when it's a real pinch gesture (trackpad pinch/ctrl+scroll
  // sends ctrlKey=true) or the user is already zoomed in. Plain two-finger
  // scrolling should never trigger zoom.
  if(!e.ctrlKey && zoom.scale <= 1) return;
  e.preventDefault();
  const delta = -e.deltaY * 0.0018;
  setZoom(zoom.scale + delta * zoom.scale * 2);
}, { passive:false });

stageEl.addEventListener('dblclick', (e) => {
  if(zoom.scale > 1){
    setZoom(1);
  } else {
    setZoom(2.4);
  }
});

// drag to pan when zoomed (mouse)
let dragging = false, dragStart = {x:0,y:0}, panStart = {x:0,y:0};
zoomWrapper.addEventListener('pointerdown', (e) => {
  if(zoom.scale <= 1) return;
  dragging = true;
  zoomWrapper.classList.add('dragging');
  dragStart = { x: e.clientX, y: e.clientY };
  panStart = { x: zoom.x, y: zoom.y };
  zoomWrapper.setPointerCapture(e.pointerId);
});
zoomWrapper.addEventListener('pointermove', (e) => {
  if(!dragging) return;
  zoom.x = panStart.x + (e.clientX - dragStart.x);
  zoom.y = panStart.y + (e.clientY - dragStart.y);
  applyZoom();
});
['pointerup','pointercancel','pointerleave'].forEach(ev => {
  zoomWrapper.addEventListener(ev, () => {
    dragging = false;
    zoomWrapper.classList.remove('dragging');
  });
});

// pinch to zoom (touch)
let pinchStartDist = null, pinchStartScale = 1;
function touchDist(t1, t2){
  return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
}
stageEl.addEventListener('touchstart', (e) => {
  if(e.touches.length === 2){
    pinchStartDist = touchDist(e.touches[0], e.touches[1]);
    pinchStartScale = zoom.scale;
  }
}, { passive:true });
stageEl.addEventListener('touchmove', (e) => {
  if(e.touches.length === 2 && pinchStartDist){
    e.preventDefault();
    const d = touchDist(e.touches[0], e.touches[1]);
    setZoom(pinchStartScale * (d / pinchStartDist));
  }
}, { passive:false });
stageEl.addEventListener('touchend', (e) => {
  if(e.touches.length < 2) pinchStartDist = null;
}, { passive:true });

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight' || e.key === ' ') { next(); e.preventDefault(); }
  else if(e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
  else if(e.key === 'Home') { goTo(0); }
  else if(e.key === 'End') { goTo(total-1); }
  else if(e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
  else if(e.key === 'Escape' && document.fullscreenElement) { document.exitFullscreen(); }
});

function toggleFullscreen(){
  const el = document.documentElement;
  if(!document.fullscreenElement){
    (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el)
      .catch(() => {});
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
  }
}

function updateFullscreenUI(){
  const isFs = !!document.fullscreenElement;
  const appEl = document.getElementById('app');
  appEl.classList.toggle('is-fullscreen', isFs);
  document.getElementById('fullscreenBtn').textContent = isFs ? '⤢' : '⛶';
  if(isFs){ armIdleTimer(); } else { appEl.classList.remove('ui-hidden'); clearTimeout(idleTimer); }
}

document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullscreenUI);
document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

// auto-hide chrome after inactivity in fullscreen for an immersive view
let idleTimer = null;
function armIdleTimer(){
  const appEl = document.getElementById('app');
  clearTimeout(idleTimer);
  appEl.classList.remove('ui-hidden');
  idleTimer = setTimeout(() => {
    if(document.fullscreenElement) appEl.classList.add('ui-hidden');
  }, 2600);
}
document.addEventListener('mousemove', () => {
  if(document.fullscreenElement) armIdleTimer();
});
document.addEventListener('touchstart', () => {
  if(document.fullscreenElement) armIdleTimer();
}, {passive:true});

// touch swipe (single-finger flip)
let touchStartX = null;
document.getElementById('stage').addEventListener('touchstart', (e) => {
  if(e.touches.length !== 1 || zoom.scale > 1){ touchStartX = null; return; }
  touchStartX = e.touches[0].clientX;
}, {passive:true});
document.getElementById('stage').addEventListener('touchend', (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 40){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null;
}, {passive:true});

// show thumb strip on hover near bottom
document.getElementById('app').addEventListener('mousemove', (e) => {
  const h = window.innerHeight;
  if(e.clientY > h - 140){
    thumbStrip.classList.add('show');
  } else {
    thumbStrip.classList.remove('show');
  }
});

buildPages();
buildThumbs();
updateUI();
applyFlips();
loadOverlay.style.display = 'none';
</script>
</body>
</html>
